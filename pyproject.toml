[project]
name = "itacode-fastapi-starter"
version = "0.1.0"
description = ""
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pymysql>=1.1.1",
    "cryptography>=46.0.1",
    "pandas>=3.0.0",
    "sqlalchemy>=2.0.41",
    "python-multipart>=0.0.22",
    "python-dotenv>=1.1.1",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "fastapi[standard]>=0.133.1",
]

[project.scripts]
dev = "app.dev_server:start"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pyright>=1.1.405",
    "ruff>=0.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.pytest]
addopts = ["-v", "-s"]
